name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - name: Build
        # With a custom domain (repository variable PAGES_CNAME, e.g. jobs.careeragent.fyi) the app lives at /;
        # otherwise GitHub serves it under /<repo>/ and Vite needs that base.
        env:
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_EXTENSION_ID: ${{ vars.VITE_EXTENSION_ID }}
        run: |
          if [ -n "$PAGES_CNAME" ]; then export VITE_BASE=/; else export VITE_BASE="/${GITHUB_REPOSITORY#*/}/"; fi
          npm run build
          # Single-page app: unknown paths must serve the app so client routing can take over.
          cp dist/index.html dist/404.html
          if [ -n "$PAGES_CNAME" ]; then echo "$PAGES_CNAME" > dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
